name: bump-pr-closing-keyword-guard

# Defense-in-depth for GitHub's closing-keyword parser. It matches
# `close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved` + `#N`
# anywhere in a PR body and has NO notion of negation or qualification, so a
# sentence written to PREVENT a close still closes the issue on merge.
#
# Four rules, three strengths:
#
#  1. FAIL — un-neutralized `close|fix|resolve #N` inside a fenced code block,
#     or anywhere in an auto-generated bump-PR body (brik-llm#1240). A BDS
#     submodule-bump PR pastes brik-bds commit subjects into the consumer
#     repo's body; those numbers resolve against the CONSUMER's tracker
#     (brik-llm#729 spuriously shut six sub-issues). The root-cause fix lives in
#     brik-bds/scripts/propagate.sh (it zero-width-breaks the refs); this is
#     the backstop for a hand-created or bypassed bump PR.
#  2. FAIL — a NEGATED closing keyword in top-level prose (brik-llm#1566):
#     `Does NOT close #N`, `won't fix #N`, `will not resolve #N`. Author intent
#     is unambiguous and the parser ignores it, so a match is always a real
#     bug. This fired for real: brik-client-portal#2436 was closed by a body
#     reading "Does NOT close #2436".
#  3. FAIL — a top-level prose close-keyword whose SAME-REPO target carries
#     `meta:project` (brik-llm#1468). An umbrella is closed deliberately in a
#     dedicated closeout, never as a side effect of a slice PR (docs PR
#     brik-llm#1467 auto-closed the brik-llm#1388 umbrella via a stray prose
#     `Closes`).
#  4. WARN — a QUALIFIED closing keyword: trailing prose after the ref, as in
#     `Closes #1437 for the docs-site consumer` (brik-bds#1437, brik-llm#1566).
#     A qualifier is not reliably separable from legitimate prose, so this only
#     prints a notice that the close will be total.
#
# Rule 1 covers fenced blocks; rules 2–4 cover non-fenced prose only. A normal
# PR's legitimate top-level `Closes #NNNN` passes all four. Cross-repo refs
# (`owner/repo#N`) stay out of scope for rules 2–4.
#
# TWO INPUTS, NOT ONE (brik-llm#3306)
#   The PR body was the only thing scanned until #3306, and GitHub's parser also
#   reads COMMIT MESSAGES merged to the default branch. PR brik-llm#3294's body
#   said `Part of #1387` — this guard passed — while its first commit read "the
#   grading that closes #1387 AC 8 names an assessment_id". The squash carried
#   that onto `main` as 5d81800 and GitHub closed #1387 at 14:33:05Z with seven
#   unticked acceptance criteria. A squash-merge concatenates EVERY commit body
#   into the merge commit message, so every commit in the PR is live input, not
#   just the last one.
#
#   Rules 2 and 3 apply to a commit message unchanged. Rule 4 is ESCALATED from
#   WARN to FAIL on that path: a qualifier in a PR body can be re-read and
#   rewritten right up to merge, while a commit message is already written and
#   its author never sees the parser's reading of it. A BARE `Closes #N` in a
#   commit message stays legitimate — `pr-task.sh` builds the PR body from the
#   commit log, so that is the repo's own convention.
#
#   Rule 1 is body-only by design: its bump-changelog markers describe a PR
#   body's pasted changelog, and a submodule-bump PR's commit messages are the
#   bump commits themselves, not the changelog.
#
# THE TWO INPUTS MUST ALSO AGREE (brikdesigns#1365)
#   Reading both inputs is not the same as comparing them, and the gap between
#   those two things is its own incident. brikdesigns PR #1362's body was edited
#   to `Part of #1354`, with the reasoning spelled out, while its commit kept a
#   BARE `Closes #1354`. #1354 closed 2s after merge with three of four
#   acceptance criteria unmet and had to be reopened by hand.
#
#   Every rule above passes that PR, and rule 4's escalation does not reach it:
#   the commit's ref is not negated, not an umbrella, and carries no trailing
#   prose to qualify. It is a legitimate bare `Closes #N` — which the section
#   above correctly declines to fail, because `pr-task.sh` builds the PR body
#   from the commit log and that convention has to keep working. What makes it a
#   defect is only visible ACROSS the two inputs: the commit closes an issue the
#   body deliberately does not.
#
#   So rule 5 FAILS when the commit messages close an issue the body does not.
#   It is ONE-DIRECTIONAL. A body-only `Closes` is fine and never fails here,
#   because the PR-merge path closes the issue on its own — the two paths are
#   distinguishable in an issue's timeline by whether the `closed` event carries
#   a `commit_id`, and measured over brikdesigns' last 30 merged PRs:
#
#       PR #1313 (body only, commits clean) → #1311 closed, commit_id = null
#       PR #1315 (body only, commits clean) → #1314 closed, commit_id = null
#       PR #1362 (commit only, body clean)  → #1354 closed, commit_id = 7781ff86
#
#   Body-only was 2 of those 30 and both were entirely correct, so failing the
#   inverse would red a working path. Commit-only was 1 of 30, and it is the one
#   that did damage.
#
# Self-testing: the FIXTURES matrix below runs before the real PR body is
# scanned and fails the job on any mismatch, so every copy of this file
# verifies its own detection logic on every PR.
#
# Portable: this file is self-contained — no repo-specific paths, no checkout.
#
# brik-llm holds the canonical copy; consumers carry copies of it. Edit the
# brik-llm copy first, then propagate — a local edit in a consumer repo is drift,
# not an improvement. Do NOT write the consumer list here: the registry in
# brik-llm `scripts/audit/overlap-twin-drift.py` is the list, and a count or set
# of repo names in this header is the stale prose every twin here has already
# gone stale as (brik-llm#2272/#2447). `overlap-twin-drift` compares the copies.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read        # resolve referenced issues' labels for the umbrella guard (brik-llm#1468)
  pull-requests: read # list the PR's commits — the second input GitHub's parser reads (brik-llm#3306)

concurrency:
  group: bump-pr-closing-keyword-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closing-keyword-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Scan PR body for un-neutralized closing-keywords
        uses: actions/github-script@v7
        with:
          script: |
            // ── Patterns ─────────────────────────────────────────────────
            // GitHub's keyword grammar, shared by every rule so the
            // conjugations can never drift apart between them.
            const KEYWORD = String.raw`close[sd]?|fix(?:e[sd])?|resolve[sd]?`;

            // Rule 1 — un-neutralized closing-keyword + issue reference. `#\d`
            // (a real digit right after `#`) means a working reference; the
            // brik-bds neutralizer inserts a zero-width space there, so a
            // neutralized body never matches.
            const VIOLATION = new RegExp(
              String.raw`\b(?:${KEYWORD})\b:?\s*(?:(?:[\w.-]+\/[\w.-]+)?#\d+|GH-\d+)`,
              'i',
            );

            // Markers identifying an auto-generated (or hand-copied) BDS
            // submodule-bump body — its whole changelog is machine-pasted and
            // carries no legitimate "Closes #N", so any keyword+ref is suspect.
            const BUMP_MARKERS = [
              /\*\*\d+\s+commits?\*\*.*since last sync/i,
              /^#{1,6}\s+BDS Update\b/im,
              /Auto-generated by\s+[`'"]?[^`'"\n]*propagate\.sh/i,
            ];

            // Rule 2 — a closing keyword under a negation, at most two words
            // away. The distance bound is what keeps ordinary prose out
            // ("this does not affect the fix in #N").
            // `['’]?` matches both the straight and the curly apostrophe —
            // GitHub's editor and macOS smart-quotes both produce the latter.
            const APOS = String.raw`['’]?`;
            const NEGATION = [
              String.raw`not`, String.raw`never`, String.raw`no`,
              String.raw`does\s+n${APOS}t`, String.raw`do\s+n${APOS}t`, String.raw`did\s+n${APOS}t`,
              String.raw`doesn${APOS}t`, String.raw`don${APOS}t`, String.raw`didn${APOS}t`,
              String.raw`won${APOS}t`, String.raw`wont`, String.raw`will\s+not`,
              String.raw`isn${APOS}t`, String.raw`cannot`, String.raw`can${APOS}t`,
            ].join('|');
            const NEGATED_CLOSE = new RegExp(
              String.raw`\b(?:${NEGATION})\s+(?:\w+\s+){0,2}?(?:${KEYWORD})\b:?\s*#(\d+)`,
              'gi',
            );

            // Rules 3+4 feed off same-repo close-keywords in top-level prose.
            // `\s*#` only matches a bare `#N` — `owner/repo#N` has no space
            // before `#`, so cross-repo refs are naturally excluded (v1).
            const SAME_REPO_CLOSE = new RegExp(String.raw`\b(?:${KEYWORD})\b:?\s*#(\d+)`, 'gi');

            // Rule 4 — trailing prose on the same line after the ref, as in
            // `Closes #1437 for the docs-site consumer`. A bare `Closes #N`
            // (with or without closing punctuation) never matches.
            const QUALIFIED_CLOSE = new RegExp(
              String.raw`\b(?:${KEYWORD})\b:?\s*#(\d+)[)\]]?[,;:.]?\s+(\S.*)$`,
              'i',
            );

            const UMBRELLA_LABEL = 'meta:project';

            const SAFE_ALTERNATIVES = [
              '  Part of #N        — a slice of a larger issue',
              '  Refs #N           — mentions it, closes nothing',
              '  Partial for #N    — some ACs done, the issue stays open',
              '  #N stays open     — explicit, and parser-proof',
            ];

            // Markdown emphasis is invisible to patterns written for plain
            // prose. In `does **not** close #N` the character after `not` is
            // `*`, not whitespace, so NEGATION matched `not` and the following
            // `\s+` failed — the keyword sailed through as un-negated prose.
            // brik-client-portal#3550 carried exactly that sentence, the guard
            // reported success, and GitHub closed #2942 two seconds after merge.
            // Bold is the natural way to emphasise that word, so the guard
            // missed precisely the phrasing an author reaches for when trying
            // hardest to prevent the close (#2565).
            //
            // Delete the wrapper characters rather than encoding them into
            // NEGATION: that keeps rules 2-4 reading plain text with no pattern
            // change, and covers the next wrapper for free instead of
            // multiplying an alternation that would miss it. The zero-width
            // space the brik-bds neutralizer inserts is deliberately NOT
            // stripped — rule 1 depends on it surviving.
            const stripEmphasis = (line) => line.replace(/[*_`~]/g, '');

            // ── Pure scanner (exercised by FIXTURES below) ────────────────
            // `bumpDetection: false` is for the commit-message path: rule 1's
            // markers describe a PR body's pasted changelog, and a commit
            // message that happens to quote one must still be read as prose by
            // rules 2-4 rather than diverted into the rule-1 bucket.
            function scanBody(body, { bumpDetection = true } = {}) {
              const isBumpPR = bumpDetection && BUMP_MARKERS.some((re) => re.test(body || ''));
              const lines = (body || '').split(/\r?\n/);
              const violations = [];        // rule 1 — fenced / bump changelog
              const negations = [];         // rule 2 — negated keyword in prose
              const qualifiers = [];        // rule 4 — trailing prose after the ref
              const proseRefs = new Set();  // rule 3 candidates — same-repo #N in prose
              let inFence = false;

              lines.forEach((line, i) => {
                if (/^\s*(```|~~~)/.test(line)) {
                  inFence = !inFence;
                  return;
                }
                // Neutralization check: fenced blocks in every PR; a bump PR's
                // un-fenced changelog lines too. A line checked here is not
                // also a prose candidate.
                if (inFence || isBumpPR) {
                  if (VIOLATION.test(line)) {
                    violations.push(`  line ${i + 1} (${inFence ? 'fenced' : 'changelog'}): ${line.trim()}`);
                  }
                  return;
                }
                // Rules 2-4 read the emphasis-stripped line. The fence check
                // above must stay on the raw one — stripping backticks first
                // would erase every ``` marker and flatten the whole body into
                // prose.
                const prose = stripEmphasis(line);
                let m;
                let negatedHere = false;
                NEGATED_CLOSE.lastIndex = 0;
                while ((m = NEGATED_CLOSE.exec(prose)) !== null) {
                  negations.push({ num: m[1], line: i + 1, text: m[0].trim() });
                  negatedHere = true;
                }
                SAME_REPO_CLOSE.lastIndex = 0;
                while ((m = SAME_REPO_CLOSE.exec(prose)) !== null) {
                  proseRefs.add(m[1]);
                }
                // A negated line already fails; don't also warn about it.
                const q = negatedHere ? null : QUALIFIED_CLOSE.exec(prose);
                if (q) qualifiers.push({ num: q[1], line: i + 1, text: line.trim() });
              });

              return { isBumpPR, violations, negations, qualifiers, proseRefs: [...proseRefs] };
            }

            // One commit message, read as the parser will read it after merge
            // (brik-llm#3306). Same grammar as the body path — only the verdict
            // on a qualifier differs, and that difference lives at the call
            // site, not here, so this stays a pure function over text.
            function scanCommitMessage(message) {
              const { negations, qualifiers, proseRefs } =
                scanBody(message, { bumpDetection: false });
              return { negations, qualifiers, proseRefs };
            }

            // Rule 5 — issues the COMMITS close that the BODY does not declare
            // (brikdesigns#1365). Pure over two ref lists, so the self-test can
            // drive it without a PR.
            //
            // The body side is scanBody's proseRefs, so a `Closes` the body only
            // carries inside a fence does not count as a declaration — quoted
            // material is not intent, and an un-neutralized one is already
            // rule 1's job.
            function commitOnlyCloses(bodyRefs, commitRefs) {
              const declared = new Set(bodyRefs);
              return [...new Set(commitRefs)].filter((num) => !declared.has(num));
            }

            // ── Fixture matrix ───────────────────────────────────────────
            // Each `expect` asserts only the counts (or refs) that must hold.
            // `ZW` is the zero-width space the brik-bds neutralizer inserts;
            // `H` keeps this matrix from carrying live references of its own.
            const ZW = '​';
            const H = '#';
            const FIXTURES = [
              // Rule 2 — negations that MUST fail.
              { name: 'does NOT close', body: `Does NOT close ${H}2436`, expect: { negations: 1, qualifiers: 0 } },
              { name: "doesn't fix", body: `This doesn't fix ${H}12 yet`, expect: { negations: 1 } },
              { name: 'will not resolve', body: `It will not resolve ${H}77`, expect: { negations: 1 } },
              { name: "won't close", body: `Won't close ${H}3`, expect: { negations: 1 } },
              { name: 'curly apostrophe', body: `Won’t close ${H}3`, expect: { negations: 1 } },
              { name: 'never closes', body: `This never closes ${H}9`, expect: { negations: 1 } },
              { name: 'negation two words away', body: `Does not fully close ${H}44`, expect: { negations: 1 } },
              { name: 'negation + colon form', body: `Does not close: ${H}44`, expect: { negations: 1 } },
              { name: 'shouting is not an escape', body: `does NOT CLOSE ${H}44`, expect: { negations: 1 } },
              { name: 'two negations on one line', body: `Does not close ${H}1 and will not fix ${H}2`, expect: { negations: 2 } },
              { name: 'negation inside inline code', body: `Body said \`does not close ${H}2436\``, expect: { negations: 1 } },
              // Rule 2 — markdown emphasis must not be an escape hatch (#2565).
              // The live miss was bold: brik-client-portal#3550 closed #2942.
              { name: 'bold negation', body: `This does **not** close ${H}2942`, expect: { negations: 1 } },
              { name: 'italic negation', body: `This does *not* close ${H}2942`, expect: { negations: 1 } },
              { name: 'underscore-bold negation', body: `This does __not__ close ${H}2942`, expect: { negations: 1 } },
              { name: 'underscore-italic negation', body: `This does _not_ close ${H}2942`, expect: { negations: 1 } },
              { name: 'backtick negation', body: `This does \`not\` close ${H}2942`, expect: { negations: 1 } },
              { name: 'strikethrough negation', body: `This does ~~not~~ close ${H}2942`, expect: { negations: 1 } },
              { name: 'emphasised keyword too', body: `This does **not** **close** ${H}2942`, expect: { negations: 1 } },
              { name: 'negation outranks the qualifier warning', body: `Does NOT close ${H}2436 — final AC lands elsewhere`, expect: { negations: 1, qualifiers: 0 } },
              // Rule 2 negatives — MUST NOT fire.
              { name: 'plain Closes', body: `Closes ${H}1566`, expect: { negations: 0, qualifiers: 0, violations: 0, proseRefs: ['1566'] } },
              // Rules 3-4 read the stripped line too, so an emphasised close is
              // still a close — it was invisible to them before #2565.
              { name: 'bold Closes is still a close', body: `**Closes** ${H}1566`, expect: { negations: 0, violations: 0, proseRefs: ['1566'] } },
              { name: 'plain Fixes', body: `Fixes ${H}1240`, expect: { negations: 0, violations: 0, proseRefs: ['1240'] } },
              { name: 'negation about something else', body: `This does not affect ${H}31`, expect: { negations: 0, proseRefs: [] } },
              { name: 'negation 4+ words from the keyword', body: `This does not, as far as we can tell, close ${H}31`, expect: { negations: 0 } },
              { name: 'negation before an unrelated ref', body: `Not a regression; closes nothing in ${H}31`, expect: { negations: 0 } },
              { name: 'prefixes is not a keyword', body: `Renames prefixes ${H}12`, expect: { negations: 0, proseRefs: [] } },
              { name: 'negated close in a fence is rule 1', body: `\`\`\`\nDoes NOT close ${H}2436\n\`\`\``, expect: { negations: 0, violations: 1 } },
              { name: 'neutralized negation passes', body: `Does NOT close ${H}${ZW}2436`, expect: { negations: 0, violations: 0 } },
              // Rule 4 — qualifiers WARN, never fail.
              { name: 'qualified close', body: `Closes ${H}1437 for the docs-site consumer`, expect: { qualifiers: 1, negations: 0, proseRefs: ['1437'] } },
              { name: 'qualified close, dash form', body: `Closes ${H}1437 — docs-site only`, expect: { qualifiers: 1 } },
              { name: 'bare close, trailing period', body: `Closes ${H}1437.`, expect: { qualifiers: 0 } },
              { name: 'bare close in parens', body: `(Closes ${H}1437)`, expect: { qualifiers: 0 } },
              { name: 'bare close, trailing whitespace', body: `Closes ${H}1437   `, expect: { qualifiers: 0 } },
              // Rule 1 — the brik-llm#1240 regression set.
              { name: 'fenced changelog ref', body: `\`\`\`\n- abc123 fix(tokens): resolves ${H}607\n\`\`\``, expect: { violations: 1 } },
              { name: 'fenced neutralized ref', body: `\`\`\`\n- abc123 fix(tokens): resolves ${H}${ZW}607\n\`\`\``, expect: { violations: 0 } },
              { name: 'bump body, unfenced ref', body: `## BDS Update\n\n**4 commits** since last sync\n\n- abc closes ${H}607`, expect: { violations: 1 } },
              { name: 'bump body, cross-repo ref', body: `## BDS Update\n\n**4 commits** since last sync\n\n- abc closes brikdesigns/brik-bds${H}607`, expect: { violations: 1 } },
              { name: 'bump body, GH- ref', body: `## BDS Update\n\n**4 commits** since last sync\n\n- abc closes GH-607`, expect: { violations: 1 } },
              { name: 'bare PR link untouched', body: `Ports the neutralizer (${H}612)`, expect: { violations: 0, negations: 0, proseRefs: [] } },
            ];

            // ── Commit-message fixtures (brik-llm#3306) ──────────────────
            // The second input. These assert on scanCommitMessage, so a matrix
            // that only ever covered bodies cannot report the commit path as
            // tested — the gap that let #1387 close.
            const COMMIT_FIXTURES = [
              // The live #3294 case, verbatim in shape: a qualified close in a
              // commit message. On the body path this is rule 4's WARN; here it
              // must be a countable qualifier so the call site can FAIL it.
              {
                name: 'live #3294 shape — qualified close in a commit subject',
                message: `chore(pm): record the AC-8 grade\n\nRecorded so the grading that closes ${H}1387 AC 8 names an assessment_id.`,
                expect: { qualifiers: 1, negations: 0, proseRefs: ['1387'] },
              },
              // The repo's own convention must keep passing: pr-task.sh builds
              // the PR body from the commit log, so a bare trailer is normal.
              {
                name: 'bare Closes trailer is the convention, not a defect',
                message: `fix(pm): tell a frozen grader from an idle roster\n\nPart of ${H}2472\nCloses ${H}3063`,
                expect: { qualifiers: 0, negations: 0, proseRefs: ['3063'] },
              },
              { name: 'commit-path negation fails', message: `Does NOT close ${H}2436`, expect: { negations: 1 } },
              { name: 'commit-path bold negation fails', message: `This does **not** close ${H}2942`, expect: { negations: 1 } },
              { name: 'commit-path bare close, trailing period', message: `Closes ${H}1437.`, expect: { qualifiers: 0, proseRefs: ['1437'] } },
              { name: 'commit-path Part of closes nothing', message: `Part of ${H}2472`, expect: { qualifiers: 0, negations: 0, proseRefs: [] } },
              { name: 'commit-path cross-repo ref is out of scope', message: `Closes brikdesigns/brik-bds${H}607`, expect: { proseRefs: [] } },
              // A commit message quoting a bump changelog must still be read as
              // prose — rule 1's markers are about a PR body, and diverting the
              // line into `violations` would hide the close from rules 2-4.
              {
                name: 'bump markers in a commit message do not divert rules 2-4',
                message: `docs: quote the changelog\n\n**4 commits** since last sync\n\nDoes NOT close ${H}607`,
                expect: { negations: 1 },
              },
            ];

            const selfTestFailures = [];
            const checkExpect = (label, got, expect) => {
              for (const [key, want] of Object.entries(expect)) {
                const actual = key === 'proseRefs' ? got.proseRefs : got[key].length;
                const ok = key === 'proseRefs'
                  ? JSON.stringify([...got.proseRefs].sort()) === JSON.stringify([...want].sort())
                  : actual === want;
                if (!ok) {
                  selfTestFailures.push(
                    `  ${label}: ${key} expected ${JSON.stringify(want)}, got ${JSON.stringify(actual)}`,
                  );
                }
              }
            };

            // Rule 5's matrix. Cross-input, so it asserts on commitOnlyCloses
            // rather than on either scanner: the defect class is invisible to a
            // fixture that reads one input at a time, which is exactly why every
            // matrix above passes brikdesigns PR #1362.
            const PARITY_FIXTURES = [
              {
                name: 'live #1362 shape — commit closes what the body only refs',
                body: `Part of ${H}1354\n\n\`Part of\`, not \`Closes\`, deliberately.`,
                commit: `fix(ci): pin the regression reference to a commit\n\nCloses ${H}1354`,
                expect: ['1354'],
              },
              {
                name: 'both inputs close the same issue',
                body: `Closes ${H}1360`,
                commit: `fix(a11y): audit two routes\n\nCloses ${H}1360`,
                expect: [],
              },
              {
                // 2 of brikdesigns' last 30 merged PRs, both correct — the body
                // path closes on its own. One-directional is a property to
                // protect here, not a gap to close.
                name: 'body-only close is NOT a finding (#1313 / #1315 shape)',
                body: `Closes ${H}1311`,
                commit: `fix(ci): tell a breakpoint diff from a capture flake`,
                expect: [],
              },
              {
                name: 'neither input closes anything',
                body: `Refs ${H}1208`,
                commit: `chore(deps): bump a pin`,
                expect: [],
              },
              {
                // GitHub ignores negation, so a negated close in a COMMIT still
                // closes. Rule 2 fails it independently; rule 5 must also see it
                // rather than read the sentence the way its author meant it.
                name: 'negated close in a commit is still a close',
                body: `Part of ${H}77`,
                commit: `fix: partial\n\nDoes not close ${H}77`,
                expect: ['77'],
              },
              {
                name: 'a body fence does not declare the close',
                body: `\`\`\`\nCloses ${H}55\n\`\`\``,
                commit: `fix: thing\n\nCloses ${H}55`,
                expect: ['55'],
              },
              {
                name: 'cross-repo commit ref is out of scope, as in rules 2-4',
                body: `Part of ${H}13`,
                commit: `fix: a\n\nCloses brikdesigns/brik-bds${H}2402`,
                expect: [],
              },
              {
                name: 'no commit refs at all does not throw',
                body: `Closes ${H}14`,
                commit: ``,
                expect: [],
              },
            ];

            for (const f of FIXTURES) checkExpect(f.name, scanBody(f.body), f.expect);
            for (const f of COMMIT_FIXTURES) {
              checkExpect(`commit/${f.name}`, scanCommitMessage(f.message), f.expect);
            }
            for (const f of PARITY_FIXTURES) {
              const got = commitOnlyCloses(
                scanBody(f.body).proseRefs,
                scanCommitMessage(f.commit).proseRefs,
              );
              if (JSON.stringify([...got].sort()) !== JSON.stringify([...f.expect].sort())) {
                selfTestFailures.push(
                  `  parity/${f.name}: expected ${JSON.stringify(f.expect)}, got ${JSON.stringify(got)}`,
                );
              }
            }

            const FIXTURE_COUNT =
              FIXTURES.length + COMMIT_FIXTURES.length + PARITY_FIXTURES.length;
            if (selfTestFailures.length > 0) {
              core.setFailed(
                [
                  `Guard self-test failed on ${selfTestFailures.length} fixture assertion(s) —`,
                  'the detection logic in this workflow is broken, so its verdict on this PR',
                  'cannot be trusted. Fix the patterns (or the fixture) before merging.',
                  '',
                  ...selfTestFailures,
                ].join('\n'),
              );
              return;
            }
            core.info(`Guard self-test: ${FIXTURE_COUNT}/${FIXTURE_COUNT} fixtures pass.`);

            // ── Scan the real PR body ────────────────────────────────────
            const body = context.payload.pull_request.body || '';
            const { isBumpPR, violations, negations, qualifiers, proseRefs } = scanBody(body);

            // ── Scan the real PR's commit messages (brik-llm#3306) ───────
            // Paginated: a squash-merge concatenates every commit body, so a
            // long branch's 40th commit is as live as its first. An unreadable
            // list is reported, never treated as clean — the blind-scan failure
            // brik-llm#1587 already paid for.
            const commitNegations = [];   // rule 2 on the commit path — FAIL
            const commitQualifiers = [];  // rule 4 ESCALATED here — FAIL
            const commitRefs = new Set(); // rule 3 candidates from commits
            const refSource = new Map();  // rule 5 — ref → the commit that closes it
            try {
              const commits = await github.paginate(github.rest.pulls.listCommits, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              for (const c of commits) {
                const sha = (c.sha || '').slice(0, 8);
                const scan = scanCommitMessage(c.commit && c.commit.message);
                for (const n of scan.negations) commitNegations.push({ ...n, sha });
                for (const q of scan.qualifiers) commitQualifiers.push({ ...q, sha });
                for (const num of scan.proseRefs) {
                  commitRefs.add(num);
                  // Keep the first commit that closes each ref, so rule 5 can
                  // name the sha and line rather than just the number.
                  if (!refSource.has(num)) {
                    const msg = (c.commit && c.commit.message) || '';
                    const hit = msg.split(/\r?\n/).find((l) =>
                      new RegExp(String.raw`\b(?:${KEYWORD})\b:?\s*#${num}\b`, 'i').test(l),
                    );
                    refSource.set(num, { sha, line: (hit || '').trim() });
                  }
                }
              }
              core.info(`Scanned ${commits.length} commit message(s) for closing keywords.`);
            } catch (e) {
              core.warning(
                `Could not list this PR's commits (${e.status || e.message}) — the ` +
                'commit-message half of this guard did not run. The PR body was still ' +
                'scanned; a closing keyword in a commit message is NOT gated on this run.',
              );
            }

            // Rule 3 — resolve each prose ref's labels; flag the umbrellas.
            // Union of both inputs: an umbrella closed from a commit message is
            // the same defect as one closed from the body.
            const umbrellaViolations = [];
            for (const num of new Set([...proseRefs, ...commitRefs])) {
              let labels = [];
              try {
                const { data } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: Number(num),
                });
                labels = (data.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
              } catch (e) {
                core.info(`Could not resolve #${num} (${e.status || e.message}) — skipping umbrella check for it.`);
                continue;
              }
              if (labels.includes(UMBRELLA_LABEL)) {
                umbrellaViolations.push(`  #${num} is labeled \`${UMBRELLA_LABEL}\` (an umbrella)`);
              }
            }

            // Rule 4 — warn only. A trailing clause is not reliably separable
            // from legitimate prose (brik-llm#1566).
            for (const q of qualifiers) {
              core.warning(
                `Line ${q.line}: this closes #${q.num} IN FULL on merge — GitHub ignores the ` +
                `qualifier after the reference. If only part of #${q.num} is done, write ` +
                `\`Part of #${q.num}\` or \`Partial for #${q.num}\` instead.\n  ${q.text}`,
              );
            }

            // Rule 5 — both inputs are read above; this is where they are
            // COMPARED (brikdesigns#1365).
            const commitOnly = commitOnlyCloses(proseRefs, [...commitRefs]);

            if (violations.length === 0 && negations.length === 0
                && umbrellaViolations.length === 0
                && commitNegations.length === 0 && commitQualifiers.length === 0
                && commitOnly.length === 0) {
              core.info(
                isBumpPR
                  ? 'Bump PR detected — no un-neutralized closing-keywords found.'
                  : 'No fenced-block, negated, or umbrella closing-keywords found '
                    + 'in the PR body or its commit messages, and the commit messages '
                    + 'close nothing the body does not.',
              );
              return;
            }

            const messages = [];
            if (violations.length > 0) {
              messages.push(
                `Found ${violations.length} un-neutralized closing-keyword reference(s) in the PR body.`,
                '',
                'On merge, GitHub would resolve these against THIS repo\'s tracker and',
                'auto-close the wrong issues (see brik-llm#1240 / the brik-llm#729 collision).',
                '',
                ...violations,
                '',
                'Fix: break each reference so it no longer auto-closes — insert a',
                'zero-width space after the `#`. Submodule-bump PRs get this',
                'automatically from brik-bds/scripts/propagate.sh; a hand-created',
                'bump PR must neutralize the pasted changelog before submitting.',
              );
            }
            if (negations.length > 0) {
              if (messages.length > 0) messages.push('');
              messages.push(
                `Found ${negations.length} NEGATED closing-keyword reference(s) in the PR body:`,
                '',
                ...negations.map((n) => `  line ${n.line}: ${n.text}`),
                '',
                'GitHub matches keyword + `#N` and ignores the negation, so each of these',
                'closes its issue on merge — the opposite of what the sentence says. This',
                'is not hypothetical: brik-client-portal#2436 was closed by a body reading',
                '"Does NOT close #2436".',
                '',
                'Fix: reference the number WITHOUT a closing keyword next to it.',
                '',
                ...SAFE_ALTERNATIVES,
              );
            }
            if (commitNegations.length > 0) {
              if (messages.length > 0) messages.push('');
              messages.push(
                `Found ${commitNegations.length} NEGATED closing-keyword reference(s) in this PR's COMMIT MESSAGES:`,
                '',
                ...commitNegations.map((n) => `  ${n.sha} line ${n.line}: ${n.text}`),
                '',
                'GitHub reads commit messages merged to the default branch, not only the',
                'PR body — and a squash-merge concatenates every commit body into the merge',
                'commit. So each of these closes its issue on merge, the opposite of what',
                'the sentence says.',
                '',
                'Fix: reword the commit (`git rebase -i`, or amend if it is the tip), or',
                'reference the number without a closing keyword next to it.',
                '',
                ...SAFE_ALTERNATIVES,
              );
            }
            if (commitQualifiers.length > 0) {
              if (messages.length > 0) messages.push('');
              messages.push(
                `Found ${commitQualifiers.length} QUALIFIED closing-keyword reference(s) in this PR's COMMIT MESSAGES:`,
                '',
                ...commitQualifiers.map((q) => `  ${q.sha} line ${q.line}: ${q.text}`),
                '',
                'GitHub ignores the qualifier and closes the issue IN FULL. In a PR body',
                'this is only a warning — the author can re-read and rewrite it before',
                'merge. A commit message is already written, and its author never sees the',
                'parser\'s reading of it, so on this path it fails.',
                '',
                'This is the brik-llm#3294 failure: its body said `Part of #1387` and this',
                'guard passed, while its first commit said "the grading that closes #1387',
                'AC 8 names an assessment_id". The squash carried that onto `main` as',
                '5d81800 and #1387 closed with seven unticked acceptance criteria.',
                '',
                'Fix: reword the commit so the keyword is not beside the reference. A BARE',
                '`Closes #N` trailer is fine — it is what `pr-task.sh` builds the body from.',
                '',
                ...SAFE_ALTERNATIVES,
              );
            }
            if (umbrellaViolations.length > 0) {
              if (messages.length > 0) messages.push('');
              messages.push(
                `This PR would close ${umbrellaViolations.length} umbrella (\`${UMBRELLA_LABEL}\`) issue(s) as a side effect:`,
                '',
                ...umbrellaViolations,
                '',
                'Umbrellas are closed deliberately with a dedicated closeout, never',
                'as a byproduct of an unrelated slice PR (see brik-llm#1468 / the brik-llm#1388',
                'incident). If closing it here is intentional, do it in a standalone',
                'closeout; otherwise neutralize the reference (insert a zero-width',
                'space after the `#`, or drop the keyword).',
              );
            }

            if (commitOnly.length > 0) {
              if (messages.length > 0) messages.push('');
              messages.push(
                `${commitOnly.length} issue(s) are closed by this PR's COMMIT MESSAGES but not by its body:`,
                '',
                ...commitOnly.map((num) => {
                  const src = refSource.get(num) || {};
                  return `  #${num}${src.sha ? `  (${src.sha})` : ''}${src.line ? `  ${src.line}` : ''}`;
                }),
                '',
                'Each of these is a BARE closing keyword, so no rule above fails it — and',
                'that is correct on its own, because `pr-task.sh` builds the PR body from',
                'the commit log. What makes it a defect is the DISAGREEMENT: the body does',
                'not close these, and the commit does.',
                '',
                'brikdesigns PR #1362 was exactly this — body edited to `Part of #1354` with',
                'the reasoning spelled out, commit left saying `Closes #1354`. #1354 closed',
                '2s after merge with three of four acceptance criteria unmet.',
                '',
                'Fix — decide which half is right, and make both agree:',
                '',
                '  Completing the issue?  add the same `Closes #N` to the PR body.',
                '  Only part of it?       amend the COMMIT to `Part of #N` / `Refs #N`.',
                '                         Editing the PR body alone does NOT help — it does',
                '                         not rewrite the commit, which is the half that fires.',
                '',
                'One-directional by design: a body-only `Closes` never fails here, because',
                'the PR-merge path closes the issue on its own.',
              );
            }

            core.setFailed(messages.join('\n'));
