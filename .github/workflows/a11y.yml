name: Accessibility (axe + Playwright)

# Runs WCAG 2.1 AA audit against the Netlify deploy-preview on every PR.
# Pattern adapted from birdwell-mutlak / brik-client-portal CI.
#
# Why deploy-preview (not local CI build): the Next.js build pulls service
# data from Supabase. Exposing service-role keys to GitHub Actions is a
# high-blast-radius secret for what should be a low-risk a11y gate. Netlify
# already builds the deploy-preview with the right secrets via its own
# Build Environment — we audit what's actually deployed.

on:
  pull_request:
    # `staging` is the pre-launch integration branch — task PRs target it, so
    # the gate must run there, not only on staging->main promotes. (Takes
    # effect once this change is on staging; pull_request filters are read from
    # the base branch.)
    branches:
      - main
      - staging
    # Run when something rendered could change, or when the gate itself changes.
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/a11y/**'
      # The readiness wait decides WHEN the suite runs against the preview, so
      # a change to it must re-run this gate (#1220).
      - 'scripts/wait-for-netlify-preview.sh'
      - '.github/workflows/a11y.yml'

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      # The readiness wait reads the Netlify commit status on the PR head SHA —
      # the only deploy signal tied to a commit rather than to the PR number
      # (#1218, adopted here per #1220).
      statuses: read
    env:
      # Auto-issued per workflow run; no manual rotation. Same pattern
      # renew-pms uses (renew-pms/.github/workflows/ci.yml). Required after
      # brikdesigns#43 migrated to @brikdesigns/bds npm package consumption.
      # Requires brikdesigns repo to be on the @brikdesigns/bds package's
      # Actions-access list (github.com → org → packages → @brikdesigns/bds →
      # Manage Actions access). Otherwise GITHUB_TOKEN gets 401 on install.
      PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Waits on the Netlify deploy status for THIS commit, then on the route
      # settling — not on a bare 200 from the PR-stable preview URL, which
      # proves only that SOME deploy of this PR was served at some point
      # (#1218, #1220). The URL comes back from Netlify's own target_url rather
      # than being reconstructed from the PR number.
      #
      # `--route /` on purpose: this suite gates ~every route, so no single
      # "heaviest" route would warm the rest, and Playwright's own navigation
      # waits settle each page it visits. The commit-status half is what this
      # gate needed.
      - name: Wait for Netlify deploy-preview
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/wait-for-netlify-preview.sh \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --route /

      - name: Run a11y suite
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run test:a11y

      # Always upload — not just on failure. The landmark/region rules
      # (best-practice tag) surface advisory findings that pass the gate but
      # are the burn-down queue; the report must persist on green runs so the
      # per-route axe-report attachments are reviewable. See brik-bds #824.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 1
