name: Visual regression (staging vs deploy-preview)

# Catches a PR that shifts OUR OWN rendering — the case visual-parity.yml does
# not cover. That workflow compares the build against the live Webflow site to
# track migration fidelity, and never fails (DIFF_THRESHOLD unset). Neither it
# nor any other check notices when, say, a @brikdesigns/bds minor changes how
# our components paint.
#
# This job compares the deploy-preview against staging on the SAME path, so the
# only variable is the PR's own diff. Unlike visual-parity this one BLOCKS: the
# self-comparison noise floor measures 0.00% once fonts and lazy images settle
# (see the height-settle wait in scripts/visual-parity.mjs), so a threshold of
# 1% is well clear of capture flake and still catches a colour or spacing shift.
#
# A PR that changes rendering ON PURPOSE declares it (#856). Two halves, the
# same shape as `repro:none` in the Brik issue canon — either alone declares
# nothing:
#
#   1. the `visual-change` LABEL on the PR — makes the waiver visible on the board
#   2. a line in the PR BODY naming the routes, from ROUTES[].name in
#      scripts/visual-parity.mjs:
#
#        Visual-change: events-grind-after-graduation, home
#
# Declared routes are reported in the job summary and do not fail the job. Every
# undeclared route still gates at DIFF_THRESHOLD. The declaration is not a free
# pass in either direction: a name matching no route fails, and so does a
# declared route that did not move AT ALL — a stale declaration would otherwise
# decay into a permanent allowlist nobody prunes.
#
# "Did not move" means 0.00% on every capture of that route, NOT "stayed under
# the threshold" (#880). A real change smaller than DIFF_THRESHOLD is still a
# change: PR #877 moved three labels to Title Case and measured 0.02–0.05%.
# Declaring it is honest, and the run reports it as declared-and-under-threshold
# rather than waiving it — nothing was let through, so nothing was waived.
#
# This is not `--no-verify`: the comparison still runs, still captures every
# route, and the waiver is annotated in the run summary rather than hidden.
# Bump DIFF_THRESHOLD only if the noise floor genuinely moves.
#
# ── Declaring, without the two footguns (#1256, both observed on PR #1254) ────
#
# You do not have to guess the route names. A failing run prints the exact line
# — console and job summary both — built from the routes that actually exceeded
# threshold, ready to paste. That is the intended loop: fail once, paste, done.
#
# FOOTGUN 1 — one `gh pr edit` can cancel its own re-run.
# Adding the label AND the body line in a single command fires `labeled` and
# `edited` about a second apart. `cancel-in-progress` below is keyed on the ref,
# so the second event cancels the first run and the PR sits red with a correct
# declaration on it. Do this instead:
#
#     gh pr edit <N> --body-file <file>      # the Visual-change: line
#     gh pr edit <N> --add-label visual-change
#
# in that order, and let the `labeled` run stand — it carries both halves. Two
# separate commands still race if you fire them back to back; the label event
# must be the LAST one, because it is the one whose payload has everything.
#
# FOOTGUN 2 — `gh run rerun` cannot clear this check.
# A re-run replays the ORIGINAL `pull_request` payload, so both halves are
# frozen as they were: `VISUAL_CHANGE_LABEL: 0` and the pre-edit body. Since
# #1106 the label half is caught — the job reads the LIVE label (see the
# `Resolve current visual-change label` step) and SKIPS a replay whose label was
# added afterwards, rather than failing it. The body half is NOT caught: the
# payload's stale body still declares nothing, so a re-run after a body-only
# edit reds again on a non-bug. A green from that skip is a skip, not a
# comparison. Only a fresh event — `edited`, `labeled`, or a push — gives a real
# verdict.

on:
  pull_request:
    # `labeled` / `unlabeled` / `edited` are load-bearing for the declaration
    # (#856): both halves live on the PR itself, so without them a PR that fails
    # and is then correctly declared stays red until someone hits re-run — and a
    # re-run reflex is exactly what this gate must not train. `edited` also fires
    # on a title change, which is a cheap re-run for a rare event.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    branches:
      - main
      - staging

# NO workflow-level `paths:` filter, deliberately — `regression` is a REQUIRED
# status check on `staging` and a workflow skipped by path filtering leaves its
# check Pending forever, blocking the merge (#1334). The filter lives in the
# `changes` job below instead. Do not "tidy" it back up here.

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: match
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' \
          | node scripts/ci-paths-match.mjs \
              --pattern 'src/**' \
              --pattern 'public/**' \
              --pattern 'next.config.*' \
              --pattern 'package.json' \
              --pattern 'package-lock.json' \
              --pattern 'scripts/visual-parity.mjs' \
              --pattern 'scripts/wait-for-netlify-preview.sh' \
              --pattern 'scripts/lib/staging-reference.mjs' \
              --pattern 'scripts/ci-paths-match.mjs' \
              --pattern '.github/workflows/visual-regression.yml' \
            >> "$GITHUB_OUTPUT"

  regression:
    needs: changes
    # Skip the staging → main promote PR (#828). Its deploy-preview is built
    # from staging's HEAD and REFERENCE_URL below *is* staging, so the job
    # compares a commit against itself: it can only ever report noise, and the
    # remedy that works is "hit re-run". Training that reflex on the one PR
    # that reaches production is worse than not running the gate there — the
    # code has already been gated on the way into staging.
    #
    # Keyed on head_ref, not base, so a hotfix branch targeting main still
    # gets a real comparison against staging.
    #
    # The `changes` half is the path filter that used to live in `on.paths`
    # (#1334). Both arms resolve to a SKIPPED job, which a required status check
    # accepts — unlike a skipped workflow, which stays Pending and blocks.
    if: needs.changes.outputs.run == 'true' && github.head_ref != 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      # Read the PR's CURRENT labels (below) to catch a stale-payload re-run.
      pull-requests: read
      # The readiness wait reads the Netlify commit status on the PR head SHA —
      # the only deploy signal tied to a commit rather than to the PR number
      # (#1218, adopted here per #1220).
      statuses: read
    env:
      PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Waits on the Netlify deploy status for THIS commit, then on the route
      # settling — not on a bare 200 from the PR-stable preview URL, which
      # proves only that SOME deploy of this PR was served at some point
      # (#1218, #1220). It also fails FAST and distinguishably when Netlify's
      # build errors out, instead of burning the full 10 minutes and going red
      # the same way a real regression does.
      #
      # `--route /` on purpose: this gate captures ~40 routes, so no single
      # "heaviest" route would warm the rest — and the per-route settle already
      # lives in the capture script (networkidle, image settle, and the
      # scrollHeight settle in scripts/visual-parity.mjs). The commit-status
      # half is what this gate needed.
      - name: Wait for Netlify deploy-preview
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/wait-for-netlify-preview.sh \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --route /

      # The label as it stands NOW, not as the payload froze it. A `gh run rerun`
      # replays the original pull_request payload, so github.event.pull_request.
      # labels is stuck at the original event — a PR labeled since would still
      # read undeclared and red again on a non-bug (#1106). This one API read
      # lets the compare step tell the two apart. Fail-safe: any error defaults
      # to `false`, so the gate runs rather than silently skips.
      - name: Resolve current visual-change label
        id: live_label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIVE=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json labels \
            --jq 'any(.labels[]; .name == "visual-change")' || echo false)
          echo "value=${LIVE:-false}" >> "$GITHUB_OUTPUT"

      # ── Pin the reference to a COMMIT, not the `staging` alias (#1354) ───────
      #
      # The old `REFERENCE_URL: https://staging--brikdesigns.netlify.app` was a
      # moving target: 162 merges landed on `staging` in the 14 days to
      # 2026-09-10, so the reference redeployed under any PR open for more than
      # a few minutes and the same head SHA re-run an hour later measured a
      # different baseline. That made this the repo's largest CI failure class
      # (52 of 96 failed runs; 31 in the last 7 days) and no DIFF_THRESHOLD
      # could fix it, because the input was not the diff.
      #
      # The merge-base is the commit the PR actually branched from. It does not
      # move while the head SHA is fixed, which is exactly AC 2/AC 3 of #1354.
      #
      # Resolved via the compare API rather than `git merge-base`, so the
      # checkout above can stay shallow — fetch-depth: 0 on every run of the
      # repo's slowest gate would cost more than this one authenticated read.
      - name: Resolve merge-base
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE=$(gh api \
            "repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.ref }}...${{ github.event.pull_request.head.sha }}" \
            --jq '.merge_base_commit.sha')
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            echo "✗ compare API returned no merge_base_commit.sha — cannot pin the reference." >&2
            exit 1
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "▸ merge-base: $BASE"

      # commit_ref → deploy id → links.permalink. NOT a URL template: the
      # `https://<sha>--brikdesigns.netlify.app` form #1354's body assumed does
      # not exist and 404s (probed on five consecutive staging commits,
      # 2026-09-10) — the mapping lives only in the deploys API response.
      #
      # NETLIFY_AUTH_TOKEN is required because `staging`-branch commits carry no
      # GitHub commit statuses at all (verified 2026-09-10: an empty statuses[]
      # on 3317f08d and 968be2ad), so the token-free path the readiness wait
      # above uses — the `netlify/brikdesigns/deploy-preview` status, which
      # Netlify posts on PR commits only — cannot reach this reference.
      #
      # A miss FAILS the step. It must never fall back to the alias: that would
      # restore the moving reference invisibly, with the gate still reporting.
      - name: Resolve pinned reference deploy
        id: reference
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          URL=$(node scripts/lib/staging-reference.mjs --sha "${{ steps.base.outputs.sha }}")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Compare deploy-preview against staging
        env:
          NETLIFY_URL: ${{ steps.deploy.outputs.url }}
          REFERENCE_MODE: self
          # The merge-base's own deploy, resolved above. visual-parity.mjs has
          # no self-mode default any more (#1354) — an empty value here is a
          # hard stop, not a quiet return to the alias.
          REFERENCE_URL: ${{ steps.reference.outputs.url }}
          DIFF_THRESHOLD: '1'
          # Both halves of the declaration (#856). The label is resolved here so
          # the script never has to reach for the GitHub API; the body is passed
          # through env, not interpolated into the run script, so a PR body can
          # never inject shell.
          VISUAL_CHANGE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') && '1' || '0' }}
          # The live label (above) so the script can skip a stale-payload re-run
          # rather than fail it (#1106). 'true' / 'false' from the `gh pr view` jq.
          VISUAL_CHANGE_LABEL_LIVE: ${{ steps.live_label.outputs.value }}
          VISUAL_CHANGE_BODY: ${{ github.event.pull_request.body }}
        run: npm run visual-regression -- "$NETLIFY_URL"

      - name: Upload report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-regression-report
          path: tests/visual-parity/
          retention-days: 1
