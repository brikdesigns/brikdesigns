name: Verify (lint + token gate + schema parity)

# Fast CI gates that don't need a deploy-preview. Catches:
#  - ESLint errors (incl. brik-tokens/no-invented-tokens — inline `var(--*)`
#    references that aren't canonical / declared / allowlisted)
#  - Token-lint script: invented-token check + service-token family rule
#    (brikdesigns#116) across .ts/.tsx/.css
#  - Token-lint self-test: fixture-based regression tests for the family rule
#  - Service-URL lint: hardcoded /services/<slug> URLs must use the canonical
#    Supabase short-form slugs (brikdesigns#113)
#  - Heading title-case lint: hardcoded marketing headings must follow the
#    title-case standard (brik-bds#910); + fixture-based self-test (brikdesigns#491)
#  - Font-weight lint: weight must be tokenized (`font.weight.*`, no literals /
#    raw var()) and every heading semibold (composite-typography initiative)
#  - Schema parity: src/types/supabase.ts ↔ src/lib/admin/*.ts SCHEMA ↔
#    src/app/(chromeless)/admin/services/_components/field-configs.ts
#  - Theme contrast lint: --text-primary/-secondary/-muted clear WCAG AA on the
#    surfaces their theme block paints them on, light + dark (brikdesigns#851)
#  - Nav service-tint lint: every service line in the service-token map has a
#    `.mega-nav--service-{line}` background rule carrying its own darkest
#    surface, so a derived tinted-line set can't outrun the CSS (brikdesigns#860)
#  - Icon-collection drift: src/lib/icons.generated.json stays in sync with
#    `ph:*` usage so no icon falls through to the api.iconify.design CDN
#    (brikdesigns#626)
#  - Section-identifier lint: every top-level marketing <section> carries a
#    stable identifier (data-section / aria-labelledby) so siblings are
#    addressable; ratchets a per-file baseline of grandfathered debt (brikdesigns#942)
#
# Sibling to a11y.yml (which waits for Netlify) and visual-parity.yml
# (which also waits for Netlify). This one runs on every push and PR.

on:
  pull_request:
    branches:
      - main
      - staging
    # Skip on doc-only / workflow-only changes. Any file that feeds lint,
    # token-gate, or schema-parity must be listed here. Push-to-staging/main
    # (merge commits) always runs — no paths filter on push.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'supabase/**'
      - 'eslint.config.mjs'
      - 'next.config.*'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
      - staging

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      packages: read
    env:
      PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ESLint (incl. brik-tokens rule)
        run: npm run lint

      - name: Token lint (.css + .ts + .tsx)
        run: npm run lint:tokens

      - name: Token lint — self-test (family rule fixtures)
        run: npm run test:lint:tokens

      # lint:tokens only inspects `var(--…)` references, so a raw literal
      # (`gap: 2px`, `border-radius: 8px`, `--surface-negative: #fdeaea`) has no
      # token to inspect and sails through. This gate closes that. It ran only
      # in .husky/pre-commit until now — bypassable by --no-verify, a GitHub web
      # edit, or a clone where `prepare` never installed the hook (#983).
      - name: Hardcoded-literal lint (raw values in token-governed properties)
        run: npm run lint:hardcoded

      - name: Hardcoded-literal lint — self-test (detector fixtures)
        run: npm run test:lint:hardcoded

      - name: Service-URL lint (no hardcoded long-form Webflow slugs)
        run: npm run lint:service-urls

      - name: Heading title-case lint (marketing JSX)
        run: npm run lint:heading-case

      - name: Heading title-case lint — self-test (fixtures)
        run: npm run test:lint:heading-case

      - name: Font-weight lint (tokenized weight + semibold headings)
        run: npm run lint:font-weight

      - name: Image-budget lint (public/ asset weight)
        run: npm run lint:images

      # brikdesigns#1228 (Path A cost-cut, portal#3537). Two-part BDS freeze:
      # (a) the spec must stay an exact pin — a caret is the hole a future
      # `npm install` floats through — and the guard's own failure path is
      # asserted in the self-test; (b) the pinned version may not CHANGE without
      # a `bds-unfreeze` label (next step), so a bump is a deliberate, labelled act.
      - name: BDS exact-pin lint (@brikdesigns/bds is frozen)
        run: npm run lint:bds-pin

      - name: BDS exact-pin lint — self-test (range-spec fixtures + CLI exit codes)
        run: npm run test:lint:bds-pin

      # The freeze's second half: fail if this PR changes the @brikdesigns/bds
      # VERSION, unless it carries `bds-unfreeze`. Kept in YAML (not the node
      # script) because it needs the base ref and the PR's labels. It compares
      # the bare semver (range prefix stripped) between base and HEAD, so a
      # formatting-only change like `^0.183.0` -> `0.183.0` (the pin this gate
      # ships with) passes; only a real version bump trips it.
      - name: BDS version-freeze guard (a bump needs the bds-unfreeze label)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'bds-unfreeze')
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          bare() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);const v=((p.dependencies||{})['@brikdesigns/bds'])||'';process.stdout.write(v.replace(/^[^0-9]*/,''))})"; }
          BASE=$(git show "origin/$GITHUB_BASE_REF:package.json" | bare)
          HEAD=$(bare < package.json)
          echo "base=$BASE head=$HEAD"
          if [ "$BASE" != "$HEAD" ]; then
            echo "::error::@brikdesigns/bds version changed ($BASE -> $HEAD) while frozen (Path A, brikdesigns/brik-client-portal#3537). Add the 'bds-unfreeze' label to override."
            exit 1
          fi

      # brikdesigns#807. A dynamic segment at a route-group root loses to every
      # named sibling silently, so the guard's own failure path is asserted too —
      # a check only ever observed passing is not a proven check.
      - name: Root dynamic-route lint (no marketing-root catch-all)
        run: npm run lint:root-dynamic-route

      - name: Root dynamic-route lint — self-test (fixtures + CLI exit codes)
        run: npm run test:lint:root-dynamic-route

      # brikdesigns#809. An externalized package whose tree CJS-requires an
      # ESM-only module 500s every on-demand render while the build, `next start`,
      # and a fresh deploy all stay green — so the guard's own failure path is
      # asserted too, and the sanitizer it protects is tested for behaviour
      # rather than for merely loading.
      - name: Externalized-package require lint (strict CJS, no ESM-only requires)
        run: npm run lint:server-require-esm

      - name: Externalized-package require lint — self-test (fixtures + CLI exit codes)
        run: npm run test:lint:server-require-esm

      # brikdesigns#860. The nav's tinted-line set is derived from the service-
      # token map, so a line with no `.mega-nav--service-{line}` background rule
      # emits the modifier class with nothing behind it — the nav renders in the
      # default surface and looks finished. #729 shipped one of five lines that
      # way and nothing failed for two weeks, so the guard's own failure path is
      # asserted too.
      - name: Nav service-tint lint (every service line has a tint rule)
        run: npm run lint:nav-service-tint

      - name: Nav service-tint lint — self-test (fixtures incl. the #729 state)
        run: npm run test:lint:nav-service-tint

      # brikdesigns#851. A brand override can repoint a page-level text token at a
      # stop that fails AA, and neither existing gate sees it: lint:tokens checks
      # names not values, and axe — which does score rendered output — reported no
      # contrast finding on any of the four routes whose form placeholders were
      # measurably at 2.17:1. Light-mode --text-muted sat under even AA-large
      # until this check existed. Its own failure path is asserted too.
      - name: Theme contrast lint (page text tokens clear AA on their surface)
        run: npm run lint:theme-contrast

      - name: Theme contrast lint — self-test (fixtures incl. the #851 state)
        run: npm run test:lint:theme-contrast

      # brikdesigns#942. Sibling marketing <section>s collapse to the same generic
      # utility classes (three `section.page-section.service-surface` on
      # /customers/[slug]), so none is addressable in devtools or a change request.
      # This ratchets a per-file baseline: a new un-identified <section> fails,
      # existing debt is grandfathered and paid down going-forward.
      - name: Section-identifier lint (every marketing <section> is addressable)
        run: npm run lint:section-id

      - name: Section-identifier lint — self-test (parser + ratchet fixtures)
        run: npm run test:lint:section-id

      - name: HTML sanitizer behaviour (XSS corpus + CMS prose preserved)
        run: npm run test:sanitize

      - name: Visual-change declaration (waiver still blocks the undeclared)
        run: npm run test:visual-change

      - name: Icon-collection drift (offline Phosphor subset in sync with usage)
        run: npm run gen:icons:check
