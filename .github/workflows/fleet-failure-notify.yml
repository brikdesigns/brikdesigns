name: fleet-failure-notify

# Pages #alerts-critical the moment a SCHEDULED workflow in this repo finishes with
# conclusion == failure — one event-driven gate in front of every scheduled cron
# here, so a red scheduled check is acted on at the failure, not found by a human
# days later (brikdesigns/brik-llm#2079).
#
# workflow_run.workflows takes explicit NAMES, not globs (GitHub Actions docs,
# verified 2026-08-09), so each scheduled workflow that does not already self-notify
# is named below. Drift is caught by the fleet gate-coverage read
# (brik-llm scripts/audit/automation-drift-rate.py + morning-check.sh): any scheduled
# workflow neither self-notifying nor listed here lands in the `none` tier and
# surfaces the next morning until it is added.
#
# Auth: an authenticated POST to the notify-router with the NOTIFY_ROUTER_AUTH bearer
# (brik-secrets purpose: notify-router-auth). The router lengths the failure streak
# server-side, decides alert/suppress/escalate, files the tracking issue in this repo,
# and resolves `alerts` → #alerts-critical from brik-llm scripts/shared/notify-routes.json
# (brikdesigns/brik-llm#2308 — migrated off the ALERTS_WEBHOOK_URL webhook in sub-task d,
# which also gains this repo the streak suppression it never had before).

on:
  workflow_run:
    workflows:
      - "Feedback widget health"
      - "Visual parity (Webflow vs Netlify)"
    types: [completed]

permissions: {}

jobs:
  page:
    # Only a failed SCHEDULED run pages. A manual/push run of a listed workflow is
    # attended; the unattended cron is the gap #2079 closes. success / cancelled /
    # skipped never page.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # NOT continue-on-error: if the router post fails, this job fails RED so the
      # notifier's own failure is loud, not silent (brikdesigns/brik-llm#2079). The
      # notifier deliberately does not list itself under `workflows:` above — a
      # self-reference would loop forever whenever the router or Slack is down.
      - name: Notify via notify-router
        env:
          NOTIFY_ROUTER_AUTH: ${{ secrets.NOTIFY_ROUTER_AUTH }}
          WF_ID: ${{ github.event.workflow_run.workflow_id }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${NOTIFY_ROUTER_AUTH}" ]; then
            echo "::error::NOTIFY_ROUTER_AUTH is unset — cannot reach the notify-router" >&2
            exit 1
          fi
          # The router lengths the streak off the Actions API, decides
          # alert/suppress/escalate, files/updates the tracking issue, and posts to
          # #alerts-critical — all server-side (brikdesigns/brik-llm#2308). -sSf fails
          # the check red on any non-2xx; a suppress returns 200 and passes silently.
          curl -sSf -X POST "https://brik-notify-router.netlify.app/notify" \
            -H "Authorization: Bearer ${NOTIFY_ROUTER_AUTH}" \
            -H 'Content-type: application/json' \
            --data "$(jq -n \
              --arg repo "${GITHUB_REPOSITORY}" \
              --argjson workflow_id "${WF_ID}" \
              --arg workflow_name "${WF_NAME}" \
              --arg branch "${WF_BRANCH}" \
              --arg run_url "${WF_URL}" \
              '{event:"workflow-failure", repo:$repo, workflow_id:$workflow_id, workflow_name:$workflow_name, branch:$branch, run_url:$run_url}')"
