name: Visual mockup baseline (landing routes)

# Gates CMS landing routes against a checked-in baseline PNG — the "wrongness"
# gate neither existing visual workflow can be (#825). visual-regression.yml
# compares the deploy-preview against staging, so a defect staging already
# carries diffs at 0% (#822 survived four days that way). visual-parity.yml
# compares against Webflow and never fails. This one compares against a blessed
# baseline that a human verified against the Paper mockup, and BLOCKS: the
# baseline is captured with the same pipeline, so the pass-case noise floor is
# ~0% while the #822 dark-canvas defect measured 14.85% against it.
#
# Expected failure mode: a PR that redesigns a landing route ON PURPOSE fails
# here. Re-author the baseline against the preview once the design is approved:
#   UPDATE_BASELINES=1 npm run visual-mockup -- <deploy-preview-url>
# then eyeball it against the Paper mockup and commit it with the PR.

on:
  pull_request:
    branches:
      - main
      - staging
    paths:
      - 'src/**'
      - 'public/**'
      - 'next.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/visual-parity/baselines/**'
      - 'scripts/visual-parity.mjs'

concurrency:
  group: visual-mockup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mockup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # The readiness wait reads the Netlify commit status on the PR head SHA —
      # the only deploy signal tied to a commit rather than to the PR number
      # (#1218).
      statuses: read
    env:
      PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Waits on the Netlify deploy status for THIS commit, then on the gated
      # route settling — not on a bare 200 from the PR-stable preview URL, which
      # is what let #1217 screenshot a half-rendered page and score 66% (#1218).
      # The gated route is passed explicitly so the wait covers the page the
      # next step actually captures.
      - name: Wait for Netlify deploy-preview
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/wait-for-netlify-preview.sh \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --route /events/grind-after-graduation

      - name: Compare deploy-preview against mockup baselines
        env:
          NETLIFY_URL: ${{ steps.deploy.outputs.url }}
        run: npm run visual-mockup -- "$NETLIFY_URL"

      - name: Upload report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-mockup-report
          path: tests/visual-parity/
          retention-days: 1
