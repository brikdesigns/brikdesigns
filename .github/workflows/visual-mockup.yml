name: Visual mockup baseline (landing routes)

# Gates CMS landing routes against a checked-in baseline PNG — the "wrongness"
# gate neither existing visual workflow can be (#825). visual-regression.yml
# compares the deploy-preview against staging, so a defect staging already
# carries diffs at 0% (#822 survived four days that way). visual-parity.yml
# compares against Webflow and never fails. This one compares against a blessed
# baseline that a human verified against the Paper mockup, and BLOCKS: the
# baseline is captured with the same pipeline, so the pass-case noise floor is
# ~0% while the #822 dark-canvas defect measured 14.85% against it.
#
# Expected failure mode: a PR that redesigns a landing route ON PURPOSE fails
# here. Re-author the baseline against the preview once the design is approved:
#   UPDATE_BASELINES=1 npm run visual-mockup -- <deploy-preview-url>
# then eyeball it against the Paper mockup and commit it with the PR.

on:
  pull_request:
    branches:
      - main
      - staging

# NO workflow-level `paths:` filter, deliberately — `mockup` is a REQUIRED
# status check on `staging` and a workflow skipped by path filtering leaves its
# check Pending forever, blocking the merge (#1334). The filter lives in the
# `changes` job below instead. Do not "tidy" it back up here.

concurrency:
  group: visual-mockup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.match.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: match
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename' \
          | node scripts/ci-paths-match.mjs \
              --pattern 'src/**' \
              --pattern 'public/**' \
              --pattern 'next.config.*' \
              --pattern 'package.json' \
              --pattern 'package-lock.json' \
              --pattern 'tests/visual-parity/baselines/**' \
              --pattern 'tests/visual-parity/figma/**' \
              --pattern 'scripts/visual-parity.mjs' \
              --pattern 'scripts/lib/figma-baseline.mjs' \
              --pattern 'scripts/wait-for-netlify-preview.sh' \
              --pattern 'scripts/ci-paths-match.mjs' \
              --pattern '.github/workflows/visual-mockup.yml' \
            >> "$GITHUB_OUTPUT"

  mockup:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # The readiness wait reads the Netlify commit status on the PR head SHA —
      # the only deploy signal tied to a commit rather than to the PR number
      # (#1218).
      statuses: read
    env:
      PACKAGES_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Waits on the Netlify deploy status for THIS commit, then on the gated
      # route settling — not on a bare 200 from the PR-stable preview URL, which
      # is what let #1217 screenshot a half-rendered page and score 66% (#1218).
      # The gated route is passed explicitly so the wait covers the page the
      # next step actually captures.
      - name: Wait for Netlify deploy-preview
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/wait-for-netlify-preview.sh \
            --sha "${{ github.event.pull_request.head.sha }}" \
            --route /events/grind-after-graduation

      - name: Compare deploy-preview against mockup baselines
        env:
          NETLIFY_URL: ${{ steps.deploy.outputs.url }}
        run: npm run visual-mockup -- "$NETLIFY_URL"

      # Figma fidelity, per section (#1392). Runs in the SAME job so it reuses
      # the deploy wait and the Chromium install above — the readiness signal is
      # per-commit and there is no reason to pay for it twice.
      #
      # NO Figma token in CI, deliberately. The baselines are checked-in PNGs, so
      # this step reads files; only re-authoring them calls Figma, and that is a
      # local operator step (see § Re-baselining below). A token here would make
      # every CI run re-render the design of record, which is the one thing a
      # baseline must not do.
      #
      # `continue-on-error` while the noise floor is unmeasured. The two sides
      # are different renderers — Chromium vs Figma — so unlike mockup mode the
      # pass-case floor is not ~0% and has to be measured per section before it
      # can block. The report is the deliverable until then; #1392's own
      # out-of-scope note is "start permissive and ratchet".
      # `if: always()` so a red mockup gate — the required check, which exits
      # non-zero and would end the job here — does not also cost the fidelity
      # report. The two answer different questions and a PR usually wants both.
      - name: Compare deploy-preview sections against Figma baselines
        id: figma
        if: always()
        continue-on-error: true
        env:
          NETLIFY_URL: ${{ steps.deploy.outputs.url }}
        run: npm run visual-figma -- "$NETLIFY_URL"

      - name: Upload report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-mockup-report
          path: tests/visual-parity/
          retention-days: 1
