# Gitleaks config for brikdesigns (PUBLIC marketing site repo).
# Extends the Brik canonical rule set (sync-managed) with this repo's allowlist.
#
# Canonical rules live in .brik-gitleaks-rules.toml — that file is synced from
# brik-llm/scripts/shared/security/templates/.brik-gitleaks-rules.toml via
# brik-llm/scripts/shared/security/sync.sh. Do not edit .brik-gitleaks-rules.toml
# in this repo — edits will be clobbered on next sync.
#
# This file (.gitleaks.toml) is hand-managed by each repo. Add repo-specific
# allowlist paths or rule overrides here.
#
# See https://github.com/gitleaks/gitleaks#configuration for syntax.

[extend]
# Only `path` is declared here. The canonical file (.brik-gitleaks-rules.toml)
# itself declares `useDefault = true`, and gitleaks v8.30.1 chains that through
# `[extend].path`, so the bundled default ruleset is inherited automatically.
# Setting both `useDefault` and `path` at the same level is a gitleaks load
# error: "unable to load config due to extend.path and extend.useDefault being
# set". If you ever consume a canonical that lacks `useDefault`, declare it here
# instead of path-chaining.
path = ".brik-gitleaks-rules.toml"

# ── Allowlist ───────────────────────────────────────────────────────────────
# Files known to contain placeholder/test values, not real secrets.

[allowlist]
description = "brikdesigns allowlist — universal baseline + repo-local"
paths = [
  '''(.*/)?\.env\.example$''',
  '''(.*/)?\.env\.template$''',
  '''(.*/)?CLAUDE\.md$''',
  '''(.*/)?\.gitleaks\.toml$''',
  # ── brikdesigns-specific ────────────────────────────────────────────────
  # npm dependency manifest — version pins occasionally match generic-api-key
  # entropy thresholds.
  '''(.*/)?package\.json$''',
  '''(.*/)?package-lock\.json$''',
]

# ── Figma file keys are public identifiers, not credentials ─────────────────
# A fileKey is the segment in a Figma URL — figma.com/design/<fileKey>/Name —
# so it appears in every share link and in the tickets that commission a design
# (#1371's body carries `yhLkzLUnG71UFTgURDvgnv` in plain text). Access is gated
# by the PAT in ~/.secrets/figma.env; the key alone opens nothing.
#
# They are 22 chars of mixed case, which clears the generic-api-key entropy
# threshold, so they read as secrets to a rule that only sees shape. Scoped by
# REGEX rather than by path: allowlisting the whole file would blind the scanner
# to a real token pasted into the same line the next time someone edits the
# route table (brikdesigns#1392).
[[rules]]
id = "generic-api-key"
[rules.allowlist]
description = "Figma fileKey — the public URL segment, gated by the PAT not by itself"
regexTarget = "line"
regexes = [
  '''fileKey:\s*'[A-Za-z0-9]{20,25}'''',
  '''figma\.com/(design|file)/[A-Za-z0-9]{20,25}''',
]
